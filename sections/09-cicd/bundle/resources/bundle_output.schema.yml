# A Unity Catalog schema as a bundle resource. Its name comes from a variable that
# each target overrides, so dev, test and prod never write to the same place.
# `bundle destroy` deletes it, along with the tables inside.

resources:
  schemas:
    bundle_output:
      catalog_name: ${var.catalog}
      name: ${var.output_schema}
      comment: Built by the Lakeshore bundle. Safe to destroy.
